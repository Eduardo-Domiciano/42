services:
  backend:
    image: 42-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_NN: ${INSTALL_NN:-0}
    container_name: 42-backend
    environment:
      DATABASE_URL: sqlite:////data/veracidade.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:4200,http://127.0.0.1:4200}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      CLAIM_USE_LLM: ${CLAIM_USE_LLM:-false}
      TOPIC_RELEVANCE_USE_LLM: ${TOPIC_RELEVANCE_USE_LLM:-false}
      NARRATIVE_USE_LLM: ${NARRATIVE_USE_LLM:-false}
      NN_ENABLED: ${NN_ENABLED:-true}
      NN_NLI_ENABLED: ${NN_NLI_ENABLED:-true}
      NN_EMBEDDINGS_ENABLED: ${NN_EMBEDDINGS_ENABLED:-true}
      NN_CLICKBAIT_ENABLED: ${NN_CLICKBAIT_ENABLED:-true}
    volumes:
      - veracidade_data:/data
    expose:
      - "8000"
    networks:
      - default
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-0.25}"
          memory: ${APP_MEMORY:-1G}

  frontend:
    image: 42-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 42-frontend
    # Sem publish no host: entrada só pelo Traefik (80/443 na rede edge).
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - default
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.veracidade.rule=Host(`${DOMAIN:?defina DOMAIN no .env}`)
      - traefik.http.routers.veracidade.entrypoints=websecure
      - traefik.http.routers.veracidade.tls.certresolver=letsencrypt
      - traefik.http.routers.veracidade.middlewares=edge-ratelimit@docker,edge-inflight@docker
      - traefik.http.services.veracidade.loadbalancer.server.port=80
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-0.25}"
          memory: ${APP_MEMORY:-1G}

volumes:
  veracidade_data:

networks:
  # Criada pelo Traefik (traefik/docker-compose.yml). Suba o Traefik antes do app.
  edge:
    external: true
    name: edge
