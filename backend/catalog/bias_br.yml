# Catálogo de parcialidade editorial — veículos Brasil
# Escala bias_score: -1.0 (esquerda) … 0.0 (centro/institucional) … +1.0 (direita)
# Isto NÃO é veredito de verdade; serve para comparar framing e ownership.
# Revisável. Ver docs/catalogo-bias.md

version: "1.1.0"
country: BR
updated_at: "2026-10-23"
methodology: |
  Julgamento curado para contraste editorial no produto ④②.
  Combina papel institucional (governo/estatística), grupo de mídia e
  linha editorial pública tipicamente atribuída ao veículo.
  Fontes oficiais usam label "institutional" (score 0) — podem ter agenda
  de governo, mas não entram no eixo esquerda/direita da mídia.

defaults:
  unlisted:
    bias_score: null
    bias_label: unknown
    ownership_name: null
    note: "Fonte sem entrada no catálogo de bias v1."

