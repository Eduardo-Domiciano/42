name: CI

on:
  pull_request:
  push:
    branches: [main]

# Runner systemd costuma ter PATH mínimo.
env:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    name: Build & check
    runs-on: [self-hosted, "42"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Desktop socket
        run: |
          set -euo pipefail
          if [ -S "${HOME}/.docker/desktop/docker.sock" ]; then
            echo "DOCKER_HOST=unix://${HOME}/.docker/desktop/docker.sock" >> "$GITHUB_ENV"
          fi
          docker version

      - name: Build images
        run: docker compose build

      # O Dockerfile do frontend já roda `ng build --configuration=production`.
      - name: Backend import check
        run: |
          docker run --rm --entrypoint python 42-backend:latest \
            -c "from app.main import app; print(app.title)"
