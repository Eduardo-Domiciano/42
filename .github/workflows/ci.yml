name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: [self-hosted, 42]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-python baixa binários x86-64-v3; a CPU deste runner não suporta.
      - name: Create venv
        run: python3 -m venv .venv

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Compile check
        run: .venv/bin/python -m compileall -q app

      - name: Import app
        run: .venv/bin/python -c "from app.main import app; print(app.title)"

  frontend:
    name: Frontend
    runs-on: [self-hosted, 42]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Usa Node do sistema (evita binários pré-compilados do setup-node).
      - name: Show Node
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build -- --configuration=production

  docker:
    name: Docker build
    runs-on: [self-hosted, 42]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
