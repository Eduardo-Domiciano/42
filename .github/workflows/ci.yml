name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build & check
    runs-on: [self-hosted, "42"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fonte única: test/test_ci.sh (exporta DOCKER_HOST no mesmo shell).
      - name: CI
        run: bash ./test/test_ci.sh
