name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        env:
          # Só para o Compose interpolar labels Traefik; CI não faz deploy.
          DOMAIN: localhost
        run: docker compose build

      - name: Backend import check
        run: |
          docker run --rm --entrypoint python 42-backend:latest \
            -c "from app.main import app; print(app.title)"
