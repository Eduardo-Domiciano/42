name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, "42"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Precisa vir ANTES do login-action (GITHUB_ENV só vale no próximo step).
      - name: Point Docker at Desktop
        run: |
          set -euo pipefail
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          if [ -S "${HOME}/.docker/desktop/docker.sock" ]; then
            echo "DOCKER_HOST=unix://${HOME}/.docker/desktop/docker.sock" >> "$GITHUB_ENV"
            echo "DOCKER_CONTEXT=default" >> "$GITHUB_ENV"
          else
            echo "::error::Docker Desktop socket ausente. Abra o Desktop no host do runner."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CD
        env:
          HOST_PORT: ${{ vars.HOST_PORT || '8080' }}
        run: bash ./test/test_cd.sh --push
