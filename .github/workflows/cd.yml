name: CD

# Deploy na VPS via self-hosted runner (label 42).
# O runner DEVE estar instalado e Idle NA VPS — não no PC local.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (VPS)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, "42"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy
        env:
          # Porta pública na VPS (override em Settings → Variables → HOST_PORT)
          HOST_PORT: ${{ vars.HOST_PORT || '8080' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || '' }}
        run: bash ./test/test_cd.sh
