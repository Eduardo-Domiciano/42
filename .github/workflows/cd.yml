name: CD

# Deploy no seu PC só sob demanda (não roda sozinho).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, "42"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point Docker at Desktop
        run: |
          set -euo pipefail
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          if [ -S "${HOME}/.docker/desktop/docker.sock" ]; then
            echo "DOCKER_HOST=unix://${HOME}/.docker/desktop/docker.sock" >> "$GITHUB_ENV"
            echo "DOCKER_CONTEXT=default" >> "$GITHUB_ENV"
          else
            echo "::error::Docker Desktop socket ausente."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: CD
        env:
          HOST_PORT: ${{ vars.HOST_PORT || '8080' }}
        run: bash ./test/test_cd.sh --push
