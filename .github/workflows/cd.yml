name: CD

# Deploy na VPS (runner self-hosted label 42).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (VPS)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, "42"]
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Docker Engine check
        run: |
          set -euo pipefail
          docker --host unix:///var/run/docker.sock info >/dev/null
          docker --host unix:///var/run/docker.sock compose version

      # 1) arquivo na VPS  2) Variables/Secrets do GitHub
      - name: Resolve DOMAIN
        env:
          GH_DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
          GH_CORS: ${{ vars.CORS_ORIGINS || secrets.CORS_ORIGINS }}
        run: |
          set -euo pipefail
          DOMAIN="${GH_DOMAIN:-}"
          CORS_ORIGINS="${GH_CORS:-}"

          for f in "${HOME}/42.cd.env" "${HOME}/actions-runner/42.cd.env" "/etc/42/cd.env"; do
            if [ -f "$f" ]; then
              echo "Lendo $f"
              # shellcheck disable=SC1090
              set -a && . "$f" && set +a
            fi
          done

          # GitHub tem prioridade se estiver preenchido
          if [ -n "${GH_DOMAIN:-}" ]; then
            DOMAIN="$GH_DOMAIN"
          fi
          if [ -n "${GH_CORS:-}" ]; then
            CORS_ORIGINS="$GH_CORS"
          fi

          if [ -z "${DOMAIN:-}" ]; then
            echo "::error::DOMAIN vazio."
            echo "Na VPS rode:"
            echo "  printf '%s\\n' 'DOMAIN=seu.dominio.com' 'CORS_ORIGINS=https://seu.dominio.com' > ~/42.cd.env"
            echo "Ou no GitHub: Settings → Actions → Variables → DOMAIN"
            exit 1
          fi

          {
            echo "DOMAIN=${DOMAIN}"
            echo "CORS_ORIGINS=${CORS_ORIGINS:-https://${DOMAIN}}"
          } >> "$GITHUB_ENV"
          echo "DOMAIN=${DOMAIN}"

      - name: Deploy
        run: bash ./test/test_cd.sh
