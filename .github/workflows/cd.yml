name: CD

# Deploy na VPS (runner self-hosted label 42).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (VPS)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, "42"]
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Docker Engine check
        run: |
          set -euo pipefail
          docker --host unix:///var/run/docker.sock info >/dev/null
          docker --host unix:///var/run/docker.sock compose version

      - name: Resolve deploy env
        env:
          GH_DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
          GH_CORS: ${{ vars.CORS_ORIGINS || secrets.CORS_ORIGINS }}
          GH_HOST_PORT: ${{ vars.HOST_PORT || secrets.HOST_PORT }}
        run: |
          set -euo pipefail
          DOMAIN="${GH_DOMAIN:-}"
          CORS_ORIGINS="${GH_CORS:-}"
          HOST_PORT="${GH_HOST_PORT:-}"

          for f in "${HOME}/42.cd.env" "${HOME}/actions-runner/42.cd.env" "/etc/42/cd.env"; do
            if [ -f "$f" ]; then
              echo "Lendo $f"
              # shellcheck disable=SC1090
              set -a && . "$f" && set +a
            fi
          done

          if [ -n "${GH_DOMAIN:-}" ]; then DOMAIN="$GH_DOMAIN"; fi
          if [ -n "${GH_CORS:-}" ]; then CORS_ORIGINS="$GH_CORS"; fi
          if [ -n "${GH_HOST_PORT:-}" ]; then HOST_PORT="$GH_HOST_PORT"; fi

          if docker --host unix:///var/run/docker.sock network inspect edge >/dev/null 2>&1; then
            echo "Rede edge presente → Traefik :80 (sem publish 8080)"
          else
            echo "Rede edge ausente → fallback :${HOST_PORT:-8080} (suba traefik/ para usar :80)"
          fi

          {
            if [ -n "${DOMAIN:-}" ]; then
              echo "DOMAIN=${DOMAIN}"
              echo "CORS_ORIGINS=${CORS_ORIGINS:-https://${DOMAIN}}"
            else
              if [ -n "${HOST_PORT:-}" ]; then
                echo "HOST_PORT=${HOST_PORT}"
              fi
              if [ -n "${CORS_ORIGINS:-}" ]; then
                echo "CORS_ORIGINS=${CORS_ORIGINS}"
              fi
            fi
          } >> "$GITHUB_ENV"

      - name: Deploy
        run: bash ./test/test_cd.sh
