# Traefik — incluído pelo docker-compose.edge.yml na raiz do 42.
#
# App:       http://IP/   e  https://IP/
# Dashboard: http://IP:8080/dashboard/   (pede usuário/senha no navegador)

services:
  traefik:
    image: traefik:v3.6.4
    container_name: edge-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-noreply@localhost}
      TRAEFIK_DASHBOARD_HOST: ${TRAEFIK_DASHBOARD_HOST:-traefik.localhost}
      TRAEFIK_DASHBOARD_AUTH: ${TRAEFIK_DASHBOARD_AUTH}
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.fields.defaultmode=drop
      - --accesslog.fields.names.ClientHost=keep
      - --accesslog.fields.names.ClientAddr=keep
      - --accesslog.fields.names.RequestMethod=keep
      - --accesslog.fields.names.RequestPath=keep
      - --accesslog.fields.names.RequestProtocol=keep
      - --accesslog.fields.names.DownstreamStatus=keep
      - --accesslog.fields.names.Duration=keep
      - --accesslog.fields.names.RouterName=keep
      - --accesslog.fields.names.ServiceName=keep
      - --accesslog.fields.names.StartUTC=keep
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.dash.address=:8080
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-noreply@localhost}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - traefik_access_logs:/var/log/traefik
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPUS:-0.25}"
          memory: ${TRAEFIK_MEMORY:-1G}
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.edge-ratelimit.ratelimit.average=${TRAEFIK_RATE_AVERAGE:-20}
      - traefik.http.middlewares.edge-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.edge-ratelimit.ratelimit.burst=${TRAEFIK_RATE_BURST:-40}
      - traefik.http.middlewares.edge-inflight.inflightreq.amount=${TRAEFIK_INFLIGHT:-40}
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
      # Painel só na :8080 (não na :80/:443 do app — evita /api do ④② ir pro Traefik)
      - traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)
      - traefik.http.routers.dashboard.entrypoints=dash
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      # HTTPS opcional do painel: Host dedicado ≠ DOMAIN do app
      - traefik.http.routers.dashboard-host.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      - traefik.http.routers.dashboard-host.entrypoints=websecure
      - traefik.http.routers.dashboard-host.priority=100
      - traefik.http.routers.dashboard-host.service=api@internal
      - traefik.http.routers.dashboard-host.tls=true
      - traefik.http.routers.dashboard-host.middlewares=dashboard-auth

networks:
  edge:
    name: edge
    external: true

volumes:
  letsencrypt:
  traefik_access_logs:
