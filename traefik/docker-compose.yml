# Traefik — incluído pelo docker-compose.edge.yml na raiz do 42.
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d --build
#
# Dashboard: http://IP/dashboard/  (basic auth)
# Portas: 80:80 e 443:443 (nunca 80:8080).

services:
  traefik:
    # v3.6.1+ negocia API Docker (v3.3 quebra no Engine 29 → 404 sem routers)
    image: traefik:v3.6.4
    container_name: edge-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-noreply@localhost}
      TRAEFIK_DASHBOARD_HOST: ${TRAEFIK_DASHBOARD_HOST:-traefik.localhost}
      # $$ no Compose → $ no container (hash apr1)
      TRAEFIK_DASHBOARD_AUTH: ${TRAEFIK_DASHBOARD_AUTH}
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-noreply@localhost}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPUS:-0.25}"
          memory: ${TRAEFIK_MEMORY:-1G}
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.edge-ratelimit.ratelimit.average=${TRAEFIK_RATE_AVERAGE:-20}
      - traefik.http.middlewares.edge-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.edge-ratelimit.ratelimit.burst=${TRAEFIK_RATE_BURST:-40}
      - traefik.http.middlewares.edge-inflight.inflightreq.amount=${TRAEFIK_INFLIGHT:-40}
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
      # HTTP sem DNS: http://IP/dashboard/  (api@internal já serve /dashboard e /api)
      - traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.priority=100
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth,edge-ratelimit,edge-inflight
      # HTTPS com host: https://TRAEFIK_DASHBOARD_HOST/
      - traefik.http.routers.dashboard-host.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      - traefik.http.routers.dashboard-host.entrypoints=websecure
      - traefik.http.routers.dashboard-host.priority=100
      - traefik.http.routers.dashboard-host.service=api@internal
      - traefik.http.routers.dashboard-host.tls=true
      - traefik.http.routers.dashboard-host.middlewares=dashboard-auth,edge-ratelimit,edge-inflight

networks:
  edge:
    name: edge
    external: true

volumes:
  letsencrypt:
