# Proxy de borda (Traefik) — sobe NA VPS.
#   cp .env.example .env && nano .env
#   docker compose up -d
#
# Limites: 1/4 CPU (0.25) e 1 GiB RAM — contém abuso/brute force.
# Apps: o frontend do 42 já usa a rede `edge` no docker-compose.yml da raiz.

services:
  traefik:
    image: traefik:v3.3
    container_name: edge-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL}
      TRAEFIK_DASHBOARD_HOST: ${TRAEFIK_DASHBOARD_HOST:?defina TRAEFIK_DASHBOARD_HOST}
      TRAEFIK_DASHBOARD_AUTH: ${TRAEFIK_DASHBOARD_AUTH:?defina TRAEFIK_DASHBOARD_AUTH}
    command:
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge
    # Teto rígido: 1/4 de core + 1 GiB (override via .env se a VPS tiver mais cores)
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPUS:-0.25}"
          memory: ${TRAEFIK_MEMORY:-1G}
        reservations:
          cpus: "0.05"
          memory: 64M
    labels:
      - traefik.enable=true
      # Rate limit global (por IP) — mitiga brute force / flood
      - traefik.http.middlewares.edge-ratelimit.ratelimit.average=${TRAEFIK_RATE_AVERAGE:-20}
      - traefik.http.middlewares.edge-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.edge-ratelimit.ratelimit.burst=${TRAEFIK_RATE_BURST:-40}
      # Máximo de requests em voo (contém saturação de conexões)
      - traefik.http.middlewares.edge-inflight.inflightreq.amount=${TRAEFIK_INFLIGHT:-40}
      # Dashboard
      - traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.middlewares=dashboard-auth,edge-ratelimit,edge-inflight
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}

networks:
  edge:
    name: edge
    driver: bridge

volumes:
  letsencrypt:
