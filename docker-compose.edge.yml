# Overlay Traefik (só com domínio DNS).
#   cd traefik && docker compose up -d
#   DOMAIN=app.seudominio.com CORS_ORIGINS=https://app.seudominio.com \
#     docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d --build
#
# Sem domínio: use só docker-compose.yml → http://IP:8080

services:
  frontend:
    ports: !reset []
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.veracidade.rule=Host(`${DOMAIN:?defina DOMAIN para o modo Traefik}`)
      - traefik.http.routers.veracidade.entrypoints=websecure
      - traefik.http.routers.veracidade.tls.certresolver=letsencrypt
      - traefik.http.routers.veracidade.middlewares=edge-ratelimit@docker,edge-inflight@docker
      - traefik.http.services.veracidade.loadbalancer.server.port=80

networks:
  edge:
    external: true
    name: edge
