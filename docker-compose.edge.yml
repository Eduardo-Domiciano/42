# Overlay Traefik — entrada pela porta 80 do proxy (rede edge).
# Sem publish no host (nada de :8080).
#
#   cd traefik && docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d --build
#
# Acesso: http://IP/  ou  http://IP:80/
# Com domínio + HTTPS: acrescente também docker-compose.edge-tls.yml

services:
  frontend:
    ports: !reset []
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.services.veracidade.loadbalancer.server.port=80
      # Catch-all HTTP na :80 do Traefik (IP ou qualquer Host)
      - traefik.http.routers.veracidade-http.rule=PathPrefix(`/`)
      - traefik.http.routers.veracidade-http.entrypoints=web
      - traefik.http.routers.veracidade-http.priority=1
      - traefik.http.routers.veracidade-http.service=veracidade
      - traefik.http.routers.veracidade-http.middlewares=edge-ratelimit@docker,edge-inflight@docker

networks:
  edge:
    external: true
    name: edge
